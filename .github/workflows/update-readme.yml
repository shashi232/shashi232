name: Auto-Update README (Joke + Roadmap)

on:
  schedule:
    # Runs every day at 05:30 UTC (11:00 AM IST — fresh start of your day)
    - cron: "30 5 * * *"
  workflow_dispatch:  # Manual trigger from GitHub Actions tab
  push:
    paths:
      - "roadmap.json"  # Also triggers when you edit your roadmap progress

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No pip installs needed — only stdlib used

      - name: 😂 Update Joke of the Day
        run: python scripts/update_joke.py

      - name: 🗺️ Update Learning Roadmap
        run: python scripts/update_roadmap.py

      - name: Commit & push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet \
            && echo "No changes to commit." \
            || git commit -m "chore: auto-update joke & roadmap [skip ci]"
          git push
